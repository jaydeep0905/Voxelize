<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOXELIZE — Advert</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Full-screen website */
    .website {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    /* Image pages */
    .page {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
    }

    .page.active {
      display: block;
      animation: reveal 0.35s ease;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    @keyframes reveal {
      from {
        opacity: 0.65;
      }
      to {
        opacity: 1;
      }
    }

    /* Navigation overlay */
    .navigation {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: white;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.38),
        rgba(0, 0, 0, 0)
      );
    }

    /* Studio logo */
    .logo {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    /* Navigation links */
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 30px;
    }

    .nav-link {
      position: relative;
      border: none;
      padding: 7px 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.25s ease;
      text-decoration: none;
      display: inline-block;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: white;
      transition: width 0.25s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: white;
    }

    .nav-link.active::after {
      width: 100%;
    }

    .nav-link:focus-visible,
    .logo:focus-visible {
      outline: 1px solid white;
      outline-offset: 5px;
    }

    /* Mobile layout */
    @media (max-width: 650px) {
      .navigation {
        padding: 22px 5%;
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
      }

      .logo {
        font-size: 19px;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 14px;
      }

      .nav-link {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="website">

    <!-- ADVERT: One image only -->
    <section class="page active" id="advert" aria-label="Advert">
      <img src="../images/advert.jpg" alt="Voxelize advertising artwork" onerror="if(this.src!=='/images/advert.jpg')this.src='/images/advert.jpg'" />
    </section>

    <!-- Fixed navigation -->
    <header class="navigation">
      <a href="/" class="logo">VOXELIZE</a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="/advert/" class="nav-link active" aria-current="page">Advert</a>
        <a href="/#projects" class="nav-link">Projects</a>
        <a href="/#about" class="nav-link">About Us</a>
        <a href="/#contact" class="nav-link">Contact</a>
      </nav>
    </header>

  </main>
</body>
</html>
